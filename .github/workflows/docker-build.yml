name: Docker Build & Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t thermaltwin:ci .

      - name: Run container in background
        run: docker run -d --name thermaltwin-test -p 8501:8501 thermaltwin:ci

      - name: Wait for Streamlit to come up
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/15)"
            sleep 2
          done
          echo "App never became healthy"
          docker logs thermaltwin-test
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f thermaltwin-test || true